[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nekotrack"
description = "Personal anime & manga tracker for Windows (AniList-powered, local SQLite library)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dynamic = ["version"]
dependencies = [
    "PySide6",
    "requests",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
nekotrack = "main:main"

[tool.setuptools]
py-modules = ["api", "database", "image_cache", "main", "season_count", "series", "updater"]
packages = ["ui", "ui.pages", "ui.widgets"]

[tool.setuptools.dynamic]
version = { file = ["VERSION"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
select = ["F", "E9"]