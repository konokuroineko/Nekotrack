name: One-time rate-limit recovery patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch search recovery
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("ui/pages/search_page.py")
          text = path.read_text(encoding="utf-8")

          old_load = '''    def load_more_results(self):
        if not self.has_searched or self.is_loading or self.pending_batch_active or not self.has_next_page:
            return
'''
          new_load = '''    def load_more_results(self):
        if not self.has_searched or self.is_loading or self.pending_batch_active or not self.has_next_page:
            return
        if getattr(self, "_rate_limit_retry_pending", False):
            return
'''
          assert old_load in text, "load_more_results block not found"
          text = text.replace(old_load, new_load, 1)

          old_error = '''        if "429" in message or "too many requests" in message.lower():
            self._update_results_title()
            return
'''
          new_error = '''        if "429" in message or "too many requests" in message.lower():
            # Keep loaded cards, remove placeholders from the failed page, and
            # automatically retry after a cooldown instead of getting stuck.
            self._trim_skeletons_to_pending()
            self.results_scroll.reset_trigger()
            if not getattr(self, "_rate_limit_retry_pending", False):
                self._rate_limit_retry_pending = True
                self.results_title.setText(
                    f"{len(self.displayed_items)} result{'s' if len(self.displayed_items) != 1 else ''} · rate limited — retrying…"
                )
                QTimer.singleShot(5000, self._retry_after_rate_limit)
            return
'''
          assert old_error in text, "429 error block not found"
          text = text.replace(old_error, new_error, 1)

          marker = '''    def search_error(self, message):
        self._start_search_error(message)
'''
          replacement = '''    def _retry_after_rate_limit(self):
        self._rate_limit_retry_pending = False
        if not self.has_searched or self.is_loading or not self.has_next_page:
            self._update_results_title()
            return
        self.results_scroll.reset_trigger()
        self.results_scroll._check()

    def search_error(self, message):
        self._start_search_error(message)
'''
          assert marker in text, "search_error marker not found"
          text = text.replace(marker, replacement, 1)

          path.write_text(text, encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/pages/search_page.py
          git rm .github/workflows/one-time-rate-limit-recovery.yml
          git commit -m "Fix search recovery after AniList rate limits"
          git push
