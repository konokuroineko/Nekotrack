name: Fix search skeleton behavior

on:
  push:
    paths:
      - .github/workflows/fix-search-skeletons.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch search page
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('ui/pages/search_page.py')
          text = path.read_text(encoding='utf-8')
          old = '''    def _trim_skeletons_to_pending(self):
        skeletons = [
            self.grid_layout.itemAt(index).widget()
            for index in range(self.grid_layout.count())
            if isinstance(self.grid_layout.itemAt(index).widget(), SkeletonCard)
        ]
        extra = max(0, len(skeletons) - len(self.pending_items))
        for skeleton in skeletons[:extra]:
            self.grid_layout.removeWidget(skeleton)
            skeleton.deleteLater()
        self._reflow_results()
'''
          new = '''    def _trim_skeletons_to_pending(self):
        # Keep the full placeholder stream while more AniList pages exist.
        # Only remove unused skeletons when the final page has been reached.
        if self.has_next_page:
            return
        skeletons = [
            self.grid_layout.itemAt(index).widget()
            for index in range(self.grid_layout.count())
            if isinstance(self.grid_layout.itemAt(index).widget(), SkeletonCard)
        ]
        extra = max(0, len(skeletons) - len(self.pending_items))
        for skeleton in skeletons[:extra]:
            self.grid_layout.removeWidget(skeleton)
            skeleton.deleteLater()
        self._reflow_results()
'''
          if old not in text:
              raise SystemExit('target block not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ui/pages/search_page.py
          git commit -m 'Fix search skeleton persistence during pagination'
          git push
