name: Adversarial stress

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to fuzz after the normal regression suite"
        required: true
        type: choice
        options:
          - "1"
          - "5"
          - "10"
          - "20"
          - "30"
          - "60"
          - "120"
          - "240"
          - "300"
        default: "10"
      seed:
        description: "Starting random seed (change it to explore a different input sequence)"
        required: true
        type: string
        default: "20261009"

permissions:
  contents: read

jobs:
  stress:
    name: Adversarial fuzz and soak
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run adversarial stress test
        env:
          STRESS_MINUTES: ${{ inputs.minutes || '10' }}
          STRESS_SEED: ${{ inputs.seed || github.run_number }}
        run: python stress_test.py --minutes "$STRESS_MINUTES" --seed "$STRESS_SEED"
      - name: Upload stress report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nekotrack-stress-report
          path: nekotrack_stress_report.json
          if-no-files-found: warn
